[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-ai-agent"
version = "0.1.0"
description = "Security automation for explicitly authorized machines"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
security-ai-agent = "security_ai_agent.cli:main"

[tool.setuptools.packages.find]
include = ["security_ai_agent*"]
